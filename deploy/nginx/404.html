<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>404 · 页面不存在</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#faf9f7; --fg:#1a1a1a; --muted:#6b6560; --line:#e6e1da; --accent:#f7931a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121212; --fg:#ededed; --muted:#9a938c; --line:#2a2a2a; --accent:#f7931a; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:24px;
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .box{max-width:440px; width:100%}
  .code{
    font-size:clamp(72px,18vw,112px); font-weight:700; line-height:1;
    letter-spacing:-.04em; color:var(--accent); font-variant-numeric:tabular-nums;
  }
  h1{font-size:20px; font-weight:600; margin:20px 0 8px}
  p{margin:0 0 28px; color:var(--muted); font-size:15px; word-break:break-all}
  a{
    display:inline-block; padding:10px 20px; border:1px solid var(--line);
    border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px;
    transition:border-color .15s,background .15s;
  }
  a:hover{border-color:var(--accent); background:rgba(247,147,26,.08)}
  .sites{margin-top:32px; padding-top:20px; border-top:1px solid var(--line);
         font-size:13px; color:var(--muted)}
  .sites a{display:inline; padding:0; border:0; font-size:13px; color:var(--muted);
           text-decoration:underline; text-underline-offset:2px}
  .sites a:hover{color:var(--accent); background:none}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p id="hint">地址可能已经改变，或者从未存在过。</p>
    <a id="home" href="/">返回首页</a>
    <div class="sites">
      更多站点：<a href="https://www.btchao.com/">比特囤币</a> ·
      <a href="https://blog.btchao.com/">博客</a> ·
      <a href="https://wiki.btchao.com/">知识库</a>
    </div>
  </div>
  <script>
    (function(){
      var host = location.hostname;
      var home = document.getElementById('home');
      var hint = document.getElementById('hint');
      if (location.pathname !== '/' && home) home.href = '/';
      if (hint) hint.textContent = host + ' 上没有这个地址，检查一下拼写？';
    })();
  </script>
</body>
</html>
