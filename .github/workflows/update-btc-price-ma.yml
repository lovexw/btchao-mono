name: Update BTC Price (sites/ma)

# 自 sites/ma（原 btc-ma-new 仓库）迁移适配：
# - 数据脚本在 sites/ma/ 下运行，产物提交回 sites/ma/public/btc-price.csv
# - 失败时在 btchao-mono 仓库开 issue 告警
on:
  schedule:
    - cron: '0 17 * * *'  # 每天北京时间凌晨 1 点运行（UTC 17:00）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-ma
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytz

      - name: Update BTC price
        id: update_btc
        continue-on-error: true
        working-directory: sites/ma
        run: python scripts/update_btc_price.py

      - name: Create Issue on Failure
        if: steps.update_btc.outcome == 'failure'
        run: |
          echo "API request failed"
          gh issue create --title "BTC Price Update Failed $(date '+%Y-%m-%d')" \
                         --body "sites/ma 数据更新失败，请检查 API 状态与 Actions 日志。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        id: commit_push
        if: steps.update_btc.outcome == 'success'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add sites/ma/public/btc-price.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 Update BTC price data"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # push 触发的 Pages 自动构建对本仓库不生效（见 docs/MAINTENANCE.md §1），
      # 数据推上去后必须自己触发一次部署，线上才会更新。
      - name: Trigger Cloudflare Pages deployment
        if: steps.update_btc.outcome == 'success' && steps.commit_push.outputs.pushed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN secret，跳过自动部署（配置方法见 docs/MAINTENANCE.md §1）"
            exit 0
          fi
          sleep 5  # 等提交在 GitHub 侧可见
          resp="$(mktemp)"
          code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/edbcf0ec7c3ee185334d13d9077ef6e9/pages/projects/btchao-ma/deployments")"
          if [ "$(python3 -c "import json;print(json.load(open('$resp')).get('success'))" 2>/dev/null)" = "True" ]; then
            echo "✅ 已触发 btchao-ma 部署: $(python3 -c "import json;print(json.load(open('$resp'))['result']['url'])")"
          else
            echo "❌ btchao-ma 部署触发失败（HTTP $code）:"; cat "$resp"; exit 1
          fi
