name: Update BTC Price (sites/ma)

# 自 sites/ma（原 btc-ma-new 仓库）迁移适配：
# - 数据脚本在 sites/ma/ 下运行，产物提交回 sites/ma/public/btc-price.csv
# - 失败时在 btchao-mono 仓库开 issue 告警
on:
  schedule:
    - cron: '0 17 * * *'  # 每天北京时间凌晨 1 点运行（UTC 17:00）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-ma
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytz

      - name: Update BTC price
        id: update_btc
        continue-on-error: true
        working-directory: sites/ma
        run: python scripts/update_btc_price.py

      - name: Create Issue on Failure
        if: steps.update_btc.outcome == 'failure'
        run: |
          echo "API request failed"
          gh issue create --title "BTC Price Update Failed $(date '+%Y-%m-%d')" \
                         --body "sites/ma 数据更新失败，请检查 API 状态与 Actions 日志。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        if: steps.update_btc.outcome == 'success'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add sites/ma/public/btc-price.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update BTC price data"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
