name: Update BTC Price and AHR999 Data (sites/ahr-dca)

# 自 sites/ahr-dca（原 ahr-dca 仓库）迁移适配：
# - 数据脚本在 sites/ahr-dca/ 下运行，产物提交回 sites/ahr-dca/
# - 原仓库里的 GitHub Pages 部署段已删除：monorepo 中由
#   Cloudflare Pages 的 watch paths（sites/ahr-dca/**）接管部署
on:
  schedule:
    # 北京时间凌晨 1:00（UTC 17:00）
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ahr-dca
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update Bitcoin price (with gap backfill)
        working-directory: sites/ahr-dca
        run: |
          python update_btc_price.py

      - name: Calculate AHR999 index and strategies
        working-directory: sites/ahr-dca
        run: |
          python calculate_ahr999.py

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        id: commit_push
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add "sites/ahr-dca/btc-price all.csv" sites/ahr-dca/ahr999_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 Update BTC price and AHR999 data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # push 触发的 Pages 自动构建对本仓库不生效（见 docs/MAINTENANCE.md §1），
      # 数据推上去后必须自己触发一次部署，线上才会更新。
      - name: Trigger Cloudflare Pages deployment
        if: steps.commit_push.outputs.pushed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN secret，跳过自动部署（配置方法见 docs/MAINTENANCE.md §1）"
            exit 0
          fi
          sleep 5  # 等提交在 GitHub 侧可见
          resp="$(mktemp)"
          code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/edbcf0ec7c3ee185334d13d9077ef6e9/pages/projects/btchao-ahr-dca/deployments")"
          if [ "$(python3 -c "import json;print(json.load(open('$resp')).get('success'))" 2>/dev/null)" = "True" ]; then
            echo "✅ 已触发 btchao-ahr-dca 部署: $(python3 -c "import json;print(json.load(open('$resp'))['result']['url'])")"
          else
            echo "❌ btchao-ahr-dca 部署触发失败（HTTP $code）:"; cat "$resp"; exit 1
          fi
