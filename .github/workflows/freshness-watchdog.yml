name: Freshness Watchdog (线上数据新鲜度看门狗)

# 兜底监控：btchao.com 13 个分站已迁到甲骨文自托管（deploy/README.md），
# 数据 workflow 只管提交，上线由服务器上的 btchao-sites-sync 定时器（每 2 分钟）完成。
# 本任务每天核对 5 个数据分站「线上数据」是否落后于「仓库 HEAD」：
#   - 落后 → 自动开 issue 告警（同站去重）；
#   - 一致 → 退出码 0。
# 服务器侧问题（拉取/构建/nginx）无法从 CI 自愈，所以只告警；修复入口见 issue 正文。
on:
  schedule:
    - cron: '40 1 * * *'  # 北京时间 09:40，在各数据 cron 完成之后
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check freshness and alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_site_freshness.py
