name: Update draw data (sites/draw)

# 自 btc-draw 仓库迁移适配（2026-10-02）：
# - 开奖脚本在 sites/draw/scripts/ 下运行，开奖数据提交回 sites/draw/data/
# - 每天北京时间 12:00（UTC 04:00）开奖；GitHub 定时任务可能有几分钟延迟，
#   但开奖目标时刻固定为北京时间 12:00，不影响结果
# - 数据提交推送后由甲骨文自托管（lottery.btchao.com）的 btchao-sites-sync 定时器
#   在 2 分钟内拉取上线，本工作流不再需要触发任何外部部署（2026-11-15 移除 Pages 部署段）
on:
  schedule:
    - cron: "0 4 * * *"   # 北京时间每天 12:00（UTC+8）
    - cron: "30 4 * * *"  # 兜底：12:30 再试一次（脚本幂等，已开奖自动跳过；
                          # 整点槽位是 GitHub 全网高峰，定时任务可能被延迟甚至丢弃——2026-10-02 首日即中招）
  workflow_dispatch:
    inputs:
      mode:
        description: "today = 开今天的奖；backfill N（如 backfill 90）= 补最近 N 天"
        default: "today"
        required: false

permissions:
  contents: write

concurrency:
  group: update-draw
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 执行开奖并更新数据
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -n "$MODE" ] && [ "$MODE" != "today" ]; then
            node sites/draw/scripts/draw.mjs --backfill "${MODE#backfill}"
          else
            node sites/draw/scripts/draw.mjs
          fi

      - name: Commit and push
        id: commit_push
        run: |
          git config user.name "draw-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add sites/draw/data
          if git diff --cached --quiet; then
            echo "开奖数据无变化，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: draw 开奖更新 $(TZ='Asia/Shanghai' date +'%F %H:%M')"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
