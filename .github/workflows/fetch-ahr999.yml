name: Fetch AHR999 Data (sites/ahr999)

# 自 sites/ahr999（原 ahr999-free 仓库）迁移适配：
# 数据文件 public/ahr999-data.json → sites/ahr999/public/ahr999-data.json
# 提交只触碰 sites/ahr999/**，经 watch paths 只会触发 ahr999 分站重部署
#
# 2026-11-05 修订：上游 https://9992100.xyz/api/ahr999 自 10-30 起持续 500，
# 单源断链导致整条数据流停摆 6 天且无告警。现在改为「上游优先 + 公开日线自算兜底」，
# 逻辑见 sites/ahr999/scripts/fetch_ahr999.py；失败开 issue，恢复后自动关闭。
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-ahr999
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch or compute AHR999 data
        id: fetch
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 sites/ahr999/scripts/fetch_ahr999.py
          echo "--- 写入的数据 ---"
          cat sites/ahr999/public/ahr999-data.json

      - name: Alert on failure
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="AHR999 数据更新失败"
          existing="$(gh issue list --state open --search "$title in:title" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "已有告警 issue #$existing，不重复创建"
          else
            gh issue create --title "$title" --body "上游 API 与本地复算都没能产出数据，站点仍在用旧 json。
          排查入口：本次 run 日志、\`sites/ahr999/scripts/fetch_ahr999.py\`。
          历史上游：https://9992100.xyz/api/ahr999 （2026-10-30 起持续 500）。"
          fi

      - name: Fail job if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1

      - name: Commit and push if changed
        id: commit_push
        if: steps.fetch.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add sites/ahr999/public/ahr999-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 Update AHR999 data - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale alert
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --search "AHR999 数据更新失败 in:title" --limit 5 --json number --jq '.[].number' \
            | while read -r n; do gh issue close "$n" --comment "数据已恢复，自动关闭。"; done

      # push 触发的 Pages 自动构建对本仓库不生效（见 docs/MAINTENANCE.md §1），
      # 数据推上去后必须自己触发一次部署，线上才会更新。
      - name: Trigger Cloudflare Pages deployment
        if: steps.commit_push.outputs.pushed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN secret，跳过自动部署（配置方法见 docs/MAINTENANCE.md §1）"
            exit 0
          fi
          sleep 5  # 等提交在 GitHub 侧可见
          resp="$(mktemp)"
          code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/edbcf0ec7c3ee185334d13d9077ef6e9/pages/projects/btchao-ahr999/deployments")"
          if [ "$(python3 -c "import json;print(json.load(open('$resp')).get('success'))" 2>/dev/null)" = "True" ]; then
            echo "✅ 已触发 btchao-ahr999 部署: $(python3 -c "import json;print(json.load(open('$resp'))['result']['url'])")"
          else
            echo "❌ btchao-ahr999 部署触发失败（HTTP $code）:"; cat "$resp"; exit 1
          fi
