name: Fetch AHR999 Data (sites/ahr999)

# 自 sites/ahr999（原 ahr999-free 仓库）迁移适配：
# 数据文件 public/ahr999-data.json → sites/ahr999/public/ahr999-data.json
# 提交只触碰 sites/ahr999/**，经 watch paths 只会触发 ahr999 分站重部署
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ahr999
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch AHR999 data
        run: |
          set -euo pipefail
          tmp_file="$(mktemp)"
          curl -fsSL https://9992100.xyz/api/ahr999 -o "$tmp_file"

          python3 - "$tmp_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)

          required = ["ahr999", "price_usd", "gma200_usd", "coin_age_days", "index_growth_valuation_usd", "updated_at_unix"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing keys in API response: {missing}")
          PY

          mv "$tmp_file" sites/ahr999/public/ahr999-data.json
          echo "Data fetched successfully"
          cat sites/ahr999/public/ahr999-data.json

      - name: Commit and push if changed
        id: commit_push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add sites/ahr999/public/ahr999-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 Update AHR999 data - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # push 触发的 Pages 自动构建对本仓库不生效（见 docs/MAINTENANCE.md §1），
      # 数据推上去后必须自己触发一次部署，线上才会更新。
      - name: Trigger Cloudflare Pages deployment
        if: steps.commit_push.outputs.pushed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN secret，跳过自动部署（配置方法见 docs/MAINTENANCE.md §1）"
            exit 0
          fi
          sleep 5  # 等提交在 GitHub 侧可见
          resp="$(mktemp)"
          code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/edbcf0ec7c3ee185334d13d9077ef6e9/pages/projects/btchao-ahr999/deployments")"
          if [ "$(python3 -c "import json;print(json.load(open('$resp')).get('success'))" 2>/dev/null)" = "True" ]; then
            echo "✅ 已触发 btchao-ahr999 部署: $(python3 -c "import json;print(json.load(open('$resp'))['result']['url'])")"
          else
            echo "❌ btchao-ahr999 部署触发失败（HTTP $code）:"; cat "$resp"; exit 1
          fi
