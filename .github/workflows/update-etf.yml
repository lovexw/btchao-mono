name: Update ETF data (sites/etf)

# 自 btc-etf-dashboard 仓库迁移适配（2026-09-28）：
# - 抓取脚本在 sites/etf/scraper/ 下运行，产物提交回 sites/etf/data/
# - 每个美股交易日晚间抓取两次（UTC）：22:30（收盘后披露陆续出炉）与次日 12:30（兜底补抓）
# - 脚本按数据日期幂等更新，重复运行不会产生重复数据；数据无变化自动跳过提交
on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 12 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-etf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/etf/scraper/package-lock.json

      - name: Install dependencies
        working-directory: sites/etf/scraper
        run: npm ci

      - name: Fetch latest ETF data
        working-directory: sites/etf/scraper
        run: node update.mjs

      - name: Commit and push
        id: commit_push
        run: |
          git config user.name "etf-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git add sites/etf/data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: etf 自动更新 $(date -u +'%F %R UTC')"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # push 触发的 Pages 自动构建对本仓库不生效（见 docs/MAINTENANCE.md §1），
      # 数据推上去后必须自己触发一次部署，线上才会更新。
      - name: Trigger Cloudflare Pages deployment
        if: steps.commit_push.outputs.pushed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN secret，跳过自动部署（配置方法见 docs/MAINTENANCE.md §1）"
            exit 0
          fi
          sleep 5  # 等提交在 GitHub 侧可见
          resp="$(mktemp)"
          code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/edbcf0ec7c3ee185334d13d9077ef6e9/pages/projects/btchao-etf/deployments")"
          if [ "$(python3 -c "import json;print(json.load(open('$resp')).get('success'))" 2>/dev/null)" = "True" ]; then
            echo "✅ 已触发 btchao-etf 部署: $(python3 -c "import json;print(json.load(open('$resp'))['result']['url'])")"
          else
            echo "❌ btchao-etf 部署触发失败（HTTP $code）:"; cat "$resp"; exit 1
          fi
