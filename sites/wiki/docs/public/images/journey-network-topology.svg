<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#f8f8f9"/>
  <rect x="0.5" y="0.5" width="759" height="359" rx="13.5" fill="none" stroke="#e2e2e6"/>
  <text x="380" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#24292f">两个网络拓扑</text>
  <text x="380" y="60" text-anchor="middle" font-size="12.5" fill="#8a8a93">一边是枢纽制，一边是网状制——没有中心，就没有总开关</text>

  <!-- 左：中心化（央行） -->
  <g>
    <text x="195" y="98" text-anchor="middle" font-size="14.5" font-weight="700" fill="#55555e">中心化：一个枢纽</text>
    <!-- 周边节点 -->
    <g fill="#b9b9c2">
      <circle cx="80"  cy="150" r="9"/><circle cx="130" cy="130" r="9"/><circle cx="185" cy="122" r="9"/>
      <circle cx="245" cy="130" r="9"/><circle cx="300" cy="152" r="9"/><circle cx="95"  cy="215" r="9"/>
      <circle cx="150" cy="245" r="9"/><circle cx="225" cy="252" r="9"/><circle cx="295" cy="228" r="9"/>
    </g>
    <!-- 连线 -->
    <g stroke="#c9c9cf" stroke-width="1.4">
      <line x1="80"  y1="150" x2="190" y2="185"/><line x1="130" y1="130" x2="190" y2="185"/>
      <line x1="185" y1="122" x2="190" y2="185"/><line x1="245" y1="130" x2="190" y2="185"/>
      <line x1="300" y1="152" x2="190" y2="185"/><line x1="95"  y1="215" x2="190" y2="185"/>
      <line x1="150" y1="245" x2="190" y2="185"/><line x1="225" y1="252" x2="190" y2="185"/>
      <line x1="295" y1="228" x2="190" y2="185"/>
    </g>
    <!-- 枢纽 -->
    <circle cx="190" cy="185" r="26" fill="#8a8a93"/>
    <text x="190" y="191" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">央</text>
    <text x="190" y="300" text-anchor="middle" font-size="11.5" fill="#8a8a93">枢纽被控制，全网被控制</text>
  </g>

  <!-- 右：分布式（比特币） -->
  <g>
    <text x="545" y="98" text-anchor="middle" font-size="14.5" font-weight="700" fill="#d97a10">分布式：几万个对等节点</text>
    <!-- mesh 连线 -->
    <g stroke="#e5c9a3" stroke-width="1.4">
      <line x1="420" y1="150" x2="478" y2="128"/><line x1="478" y1="128" x2="540" y2="140"/>
      <line x1="540" y1="140" x2="600" y2="128"/><line x1="600" y1="128" x2="655" y2="155"/>
      <line x1="420" y1="150" x2="450" y2="205"/><line x1="478" y1="128" x2="450" y2="205"/>
      <line x1="540" y1="140" x2="520" y2="190"/><line x1="450" y1="205" x2="520" y2="190"/>
      <line x1="520" y1="190" x2="590" y2="200"/><line x1="600" y1="128" x2="590" y2="200"/>
      <line x1="655" y1="155" x2="590" y2="200"/><line x1="450" y1="205" x2="470" y2="258"/>
      <line x1="520" y1="190" x2="470" y2="258"/><line x1="590" y1="200" x2="555" y2="252"/>
      <line x1="470" y1="258" x2="555" y2="252"/><line x1="590" y1="200" x2="640" y2="230"/>
      <line x1="555" y1="252" x2="640" y2="230"/><line x1="655" y1="155" x2="640" y2="230"/>
      <line x1="540" y1="140" x2="478" y2="128"/><line x1="540" y1="140" x2="590" y2="200"/>
    </g>
    <!-- 节点 -->
    <g fill="#f7931a">
      <circle cx="420" cy="150" r="10"/><circle cx="478" cy="128" r="10"/><circle cx="540" cy="140" r="10"/>
      <circle cx="600" cy="128" r="10"/><circle cx="655" cy="155" r="10"/><circle cx="450" cy="205" r="10"/>
      <circle cx="520" cy="190" r="10"/><circle cx="590" cy="200" r="10"/><circle cx="470" cy="258" r="10"/>
      <circle cx="555" cy="252" r="10"/><circle cx="640" cy="230" r="10"/>
    </g>
    <g fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">
      <text x="420" y="153.5">N</text><text x="478" y="131.5">N</text><text x="540" y="143.5">N</text>
      <text x="600" y="131.5">N</text><text x="655" y="158.5">N</text><text x="450" y="208.5">N</text>
      <text x="520" y="193.5">N</text><text x="590" y="203.5">N</text><text x="470" y="261.5">N</text>
      <text x="555" y="255.5">N</text><text x="640" y="233.5">N</text>
    </g>
    <text x="545" y="300" text-anchor="middle" font-size="11.5" fill="#8a8a93">任何节点都可增减，规则由每个节点自己执行</text>
  </g>

  <text x="380" y="338" text-anchor="middle" font-size="12.5" font-weight="600" fill="#55555e">没有中心 · 没有总部 · 没有开关</text>
</svg>
