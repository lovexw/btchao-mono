<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#f8f8f9"/>
  <rect x="0.5" y="0.5" width="759" height="399" rx="13.5" fill="none" stroke="#e2e2e6"/>
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">一颗种子，一棵密钥树</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#8a8a93">备份一次助记词，整棵树上的所有密钥与地址永远可恢复</text>

  <!-- 助记词 -->
  <g>
    <rect x="290" y="80" width="180" height="46" rx="10" fill="#24292f"/>
    <text x="380" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f7931a">助记词 12/24 词</text>
    <text x="380" y="118" text-anchor="middle" font-size="10.5" fill="#b9b9c2">唯一的秘密 · 请钢板刻录备份</text>
  </g>

  <line x1="380" y1="126" x2="380" y2="160" stroke="#c9c9cf" stroke-width="1.6" marker-end="url(#arr3)"/>
  <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9c9cf"/></marker></defs>

  <!-- 主密钥 -->
  <g>
    <rect x="300" y="164" width="160" height="40" rx="9" fill="#ffffff" stroke="#f7931a" stroke-width="1.6"/>
    <text x="380" y="189" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d97a10">主私钥（BIP 32 派生）</text>
  </g>

  <!-- 分叉线 -->
  <g stroke="#c9c9cf" stroke-width="1.4">
    <line x1="380" y1="204" x2="380" y2="228"/>
    <line x1="110" y1="228" x2="650" y2="228"/>
    <line x1="110" y1="228" x2="110" y2="252"/><line x1="245" y1="228" x2="245" y2="252"/>
    <line x1="380" y1="228" x2="380" y2="252"/><line x1="515" y1="228" x2="515" y2="252"/>
    <line x1="650" y1="228" x2="650" y2="252"/>
  </g>

  <!-- 子密钥/地址 -->
  <g>
    <g>
      <rect x="38" y="252" width="144" height="54" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
      <text x="110" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55555e">账户 0 · 地址 #0</text>
      <text x="110" y="293" text-anchor="middle" font-size="10.5" fill="#8a8a93" font-family="Menlo, monospace">bc1q…x7k2</text>
    </g>
    <g>
      <rect x="173" y="252" width="144" height="54" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
      <text x="245" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55555e">账户 0 · 地址 #1</text>
      <text x="245" y="293" text-anchor="middle" font-size="10.5" fill="#8a8a93" font-family="Menlo, monospace">bc1q…9d3f</text>
    </g>
    <g>
      <rect x="308" y="252" width="144" height="54" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
      <text x="380" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55555e">账户 0 · 地址 #2</text>
      <text x="380" y="293" text-anchor="middle" font-size="10.5" fill="#8a8a93" font-family="Menlo, monospace">bc1q…m4tz</text>
    </g>
    <g>
      <rect x="443" y="252" width="144" height="54" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
      <text x="515" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55555e">账户 1 · 地址 #0</text>
      <text x="515" y="293" text-anchor="middle" font-size="10.5" fill="#8a8a93" font-family="Menlo, monospace">bc1q…p8we</text>
    </g>
    <g>
      <rect x="578" y="252" width="144" height="54" rx="9" fill="#ffffff" stroke="#e2e2e6"/>
      <text x="650" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55555e">…百万个地址</text>
      <text x="650" y="293" text-anchor="middle" font-size="10.5" fill="#8a8a93">全部按确定性派生</text>
    </g>
  </g>

  <text x="380" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#55555e">设备可以坏、可以丢、可以换代——种子在，钱包就在</text>
  <text x="380" y="362" text-anchor="middle" font-size="11" fill="#8a8a93">「备份钱包」备份的从来不是设备或软件，而是这串词</text>
  <text x="380" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#e05252">任何人拿到这串词 = 拿到全部比特币</text>
</svg>
